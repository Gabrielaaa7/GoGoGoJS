<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Miton C pokus</title>
  <script src="https://unpkg.com/gojs/release/go.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #diagramDiv { width: 100%; height: 100%; background-color: #f9f9f9; }
  </style>
</head>
<body>
  <div id="diagramDiv"></div>

  <script>
    const $ = go.GraphObject.make;

    const diagram = $(go.Diagram, "diagramDiv", {
      layout: $(go.LayeredDigraphLayout, {
  direction: 0,  // nebo 90 pro vertikální
  layerSpacing: 50
})
});


    diagram.nodeTemplate =
  $(go.Node, "Horizontal",
    $(
      "TreeExpanderButton",
      { width: 14, height: 14 }
    ),
    $(go.Panel, "Auto",
      $(go.Shape, "RoundedRectangle", { fill: "lightblue", strokeWidth: 0 }),
      $(go.TextBlock, { margin: 8, font: "bold 14px sans-serif" },
        new go.Binding("text", "name"))
    )
  );

  diagram.nodeTemplateMap.add("note",
  $(go.Node, "Auto",
    $(go.Shape, "RoundedRectangle", {
      fill: "#fff4b5", stroke: "#e0b400", strokeWidth: 1, strokeDashArray: [4, 2]
    }),
    $(go.TextBlock, {
      margin: 6, font: "12px italic sans-serif", stroke: "#5c4a00", wrap: go.TextBlock.WrapFit, width: 160
    },
    new go.Binding("text", "name"))
  )
);

diagram.linkTemplateMap.add("noteLink",
$(go.Link,
    {
      selectable: false,
      routing: go.Link.Normal
    },
    new go.Binding("fromSpot", "fromSpot", go.Spot.parse),
    new go.Binding("toSpot", "toSpot", go.Spot.parse),
    $(go.Shape, { stroke: "#999", strokeDashArray: [4, 2] }),
    $(go.Shape, { toArrow: "OpenTriangle", stroke: "#999" })
  )
);

diagram.addDiagramListener("TreeCollapsed", function(e) {
  const node = e.subject;
  diagram.findNodesByExample({ relatedTo: node.data.key }).each(n => n.visible = false);
});

diagram.addDiagramListener("TreeExpanded", function(e) {
  const node = e.subject;
  diagram.findNodesByExample({ relatedTo: node.data.key }).each(n => n.visible = true);
});

    diagram.linkTemplate =
      $(go.Link,
        $(go.Shape),
        $(go.Shape, { toArrow: "OpenTriangle" })
      );

      diagram.model = new go.GraphLinksModel(
  [
  { key: 1, name: "Miton C"},
  { key: 2, name: "M unchained SE" },
    { key: 3, name: "M unchained 2/10 O/U s.r.o." },
    { key: 4, name: "2/10 O/U Limited GIB" },
    { key: 5, name: "O/U Capital Limited" },
    { key: 6, name: "LPs #1" },
    { key: 7, name: "LPs #2" },
    { key: 8, name: "LPs #3" },
    { key: 9, name: "Martin Hála" },
    { key: 10, name: "Vojtěch Piškora" },
    { key: 11, name: "Stanislav Cífka" },
    { key: 12, name: "Relic Capital Limited" },
    { key: 13, name: "M Relic Capital s.r.o." },
    {key: 14, name: "Participation Shares - LPs, 2/10 O/U Ltd., MH, VP, SC", category: "note", relatedTo: "5", fromSpot: "RightCenter", toSpot: "BottomCenter" },

  ],
  [
  { from: 1, to: 2},
  { from: 2, to: 3 },
    { from: 3, to: 4 },
    { from: 4, to: 5},
    { from: 4, to: 6},
    { from: 4, to: 7},
    { from: 4, to: 8},
    { from: 4, to: 9},
    { from: 4, to: 10},
    { from: 4, to: 11},
    { from: 9, to: 12},
    { from: 10, to: 12},
    { from: 11, to: 12},
    { from: 12, to: 5},
    { from: 13, to: 12},
    { from: 6, to: 5},
    { from: 7, to: 5},
    { from: 8, to: 5},
    { from: 1, to: 13},
    { from: 14, to: 5, category: "noteLink"},
  ]
);

  </script>
</body>
</html>
