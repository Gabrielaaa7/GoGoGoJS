<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Styled GoJS Diagram</title>
  <script src="/static/gojs/release/go-debug.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }
    #myDiagramDiv {
      width: 100%;
      height: 600px;
      border: 2px solid #555;
    }
  </style>
</head>
<body>
  <h2>Custom Styled Diagram</h2>
  <div id="myDiagramDiv"></div>

  <script>
    const $ = go.GraphObject.make;

    const myDiagram = $(go.Diagram, "myDiagramDiv", {
      "undoManager.isEnabled": true
    });

    // Define custom style (you can expand this later)
    myDiagram.nodeTemplate =
      $(go.Node, "Auto",
        $(go.Shape, "RoundedRectangle",
          {
            fill: "lightgray",
            stroke: "black",
            strokeWidth: 2
          },
          new go.Binding("fill", "color")
        ),
        $(go.TextBlock,
          {
            font: "bold 16px sans-serif",
            margin: 8,
            stroke: "#333"
          },
          new go.Binding("text", "text")
        )
      );

    // Load from JSON file (mocked here, see Python section next)
    fetch('/static/data/diagram.json')
      .then(res => res.json())
      .then(data => {
        myDiagram.model = go.Model.fromJson(data);
      });
  </script>
</body>
</html>
